    <text x="650" y="395">[S]</text>
    <text x="30" y="78">μ</text>
    <text x="605" y="58" fill="#b45309">μ max</text>
    <text x="225" y="388">K<tspan baseline-shift="sub" font-size="17">S</tspan></text>
    <text x="18" y="219">½ μ max</text>
  </g>
  <text x="380" y="410" text-anchor="middle" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="19">Concentration en substrat limitant</text>
